name: wavensapp

services:
  app:
    build:
      context: .
      dockerfile: Dockerfile

    container_name: wavens-app

    ports:
      - '4200:4200'

    volumes:
      - .:/app
      - /app/node_modules

    environment:
      API_URL: http://backend:3000

    networks:
      - app_network

networks:
  app_network:
    driver: bridge
