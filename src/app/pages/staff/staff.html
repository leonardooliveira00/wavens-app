<mat-card class="ml-4 mr-4">
    <div class="flex flex-col gap-4">
        <mat-card-header class="ml-4">
            <mat-card-title>
                <h1>Colaboradores</h1>
            </mat-card-title>
            <mat-card-subtitle>
                <p>Gerencie os colaboradores da redação.</p>
            </mat-card-subtitle>
        </mat-card-header>
    </div>

    <mat-card-content>

        <div class="flex flex-col gap-4">
            <mat-card>
                <mat-card-content>
                    <div class="flex flex-1 min-w-0 items-center justify-between gap-4">

                        <mat-form-field subscriptSizing="dynamic" class="w-full">
                            <mat-icon matIconPrefix>search</mat-icon>
                            <mat-label>Pesquisar colaboradores</mat-label>
                            <input matInput type="search">
                        </mat-form-field>


                        <button matFab extended>
                            <mat-icon>person_add</mat-icon>
                            Adicionar
                        </button>
                    </div>
                </mat-card-content>
            </mat-card>


            <mat-card>
                <mat-card-content>
                    <table mat-table [dataSource]="listItems()" class="mat-shadow-2 w-full">

                        <ng-container matColumnDef="id">
                            <th mat-header-cell *matHeaderCellDef>UUID</th>
                            <td mat-cell *matCellDef="let element">{{element.id}}</td>
                        </ng-container>

                        <ng-container matColumnDef="firstName">
                            <th mat-header-cell *matHeaderCellDef>Firstname</th>
                            <td mat-cell *matCellDef="let element">{{element.firstName}}</td>
                        </ng-container>

                        <ng-container matColumnDef="lastName">
                            <th mat-header-cell *matHeaderCellDef>Lastname</th>
                            <td mat-cell *matCellDef="let element">{{element.lastName}}</td>
                        </ng-container>

                        <ng-container matColumnDef="email">
                            <th mat-header-cell *matHeaderCellDef>Email</th>
                            <td mat-cell *matCellDef="let element">{{element.email}}</td>
                        </ng-container>

                        <ng-container matColumnDef="actions">
                            <th mat-header-cell *matHeaderCellDef>Ações</th>

                            <td mat-cell *matCellDef="let element">
                                <button mat-icon-button>
                                    <mat-icon>edit</mat-icon>
                                </button>

                                <button mat-icon-button>
                                    <mat-icon>block</mat-icon>
                                </button>
                            </td>
                        </ng-container>

                        <tr mat-header-row *matHeaderRowDef="displayedColumns; sticky: true"></tr>
                        <tr mat-row *matRowDef="let row; columns: displayedColumns;"></tr>
                    </table>

                    @if(staffService.isLoadingMore()){
                    <div class="flex items-center">
                        <mat-progress-bar mode="indeterminate"></mat-progress-bar>
                    </div>
                    }

                </mat-card-content>

                <mat-card-actions>

                    @if(hasMore()){
                    <div class="flex items-center justify-center w-full">
                        <button matFab extended (click)="staffService.loadNextPage()">
                            <mat-icon>sync</mat-icon>
                            Carregar mais
                        </button>
                    </div>
                    }
                </mat-card-actions>

            </mat-card>
        </div>
    </mat-card-content>
</mat-card>
