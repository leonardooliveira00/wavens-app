<mat-toolbar class="justify-end">
    <div class="flex gap-2">
        <button mat-icon-button aria-label="Theme Button" (click)="toggleTheme()">
            @if (isDarkMode()) {
            <mat-icon>
                light_mode
            </mat-icon>
            }
            @else {
            <mat-icon>
                dark_mode
            </mat-icon>
            }
        </button>

        <button mat-icon-button aria-label="Notifications Button">
            <mat-icon>notifications</mat-icon>
        </button>

        <button mat-icon-button aria-label="Logout Button" (click)="logoutUser()">
            <mat-icon>logout</mat-icon>
        </button>
    </div>
</mat-toolbar>
